services:
  redis:
    image: redis:7-alpine
    container_name: redis_dev
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "5540:5540"
    depends_on:
      - redis

  mongodb:
    image: mongo:latest
    container_name: mongodb_dev
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 2048M

volumes:
  redis_data:
  mongodb_data:
