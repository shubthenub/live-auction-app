config:
  target: "http://localhost:3000"
  processor: "./dynamicBid.cjs"
  payload:
    path: "mock-users.csv"
    fields:
      - "id"
      - "token"
    order: sequence
  engines:
    socketio-v3: {}
  phases:
    - duration: 100
      arrivalRate: 20
      name: "2000 clients"

scenarios:
  - name: "Bid Latency Measurement"
    engine: socketio-v3
    flow:
      - connect:
          transports: ["websocket"]
          auth:
            token: "{{ token }}"

      - emit:
          channel: "joinAuction"
          data:
            auctionId: "69bbd92a9be31f16f6a4bf09"

      - set:
          auctionId: "69bbd92a9be31f16f6a4bf09"

      - think: 1

      - loop:
          - function: "generateBid"
          - emit:
              channel: "placeBid"
              data:
                auctionId: "{{ auctionId }}"
                amount: "{{ dynamicBid }}"
              acknowledge: true
          - think: 3
        count: 33
