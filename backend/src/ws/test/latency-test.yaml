config:
  target: "http://localhost:3000"
  processor: "./dynamicBid.cjs"

  payload:
    path: "mock-users.csv"
    fields:
      - "id"
      - "token"
    order: sequence

  engines:
    socketio-v3: {}

  phases:
    - duration: 100
      arrivalRate: 20
      name: "2000 clients"

scenarios:
  - name: "Bid Latency Measurement"
    engine: socketio-v3
    beforeScenario: "beforeScenario"      # runs before socket connects
    flow:
      - emit:
          channel: "joinAuction"
          data:
            auctionId: "69bb343006f6a6043c9f9b04"

      - set:
          auctionId: "69bb343006f6a6043c9f9b04"

      - think: 1

      - loop:
          - function: "generateBid"
          - function: "placeBidWithLatency"
          - think: 3
        count: 33